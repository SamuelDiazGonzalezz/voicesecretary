<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Peugeot 205 Turbo 16</title>
<style>
  html, body { margin: 0; background: #0E0F12; }
  canvas { display: block; width: 100vw; height: auto; max-height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
  import { init, seek } from './scenes.js';
  import { DURATION } from './timeline.js';

  const fonts = [
    ['Saira SC', 'SairaSC-ExtraBoldItalic.ttf', { style: 'italic', weight: '800' }],
    ['Saira SC', 'SairaSC-BlackItalic.ttf', { style: 'italic', weight: '900' }],
    ['Saira SC', 'SairaSC-ExtraBold.ttf', { weight: '800' }],
    ['Saira', 'Saira-Medium.ttf', { weight: '500' }],
    ['Saira', 'Saira-SemiBold.ttf', { weight: '600' }],
    ['Saira', 'Saira-Bold.ttf', { weight: '700' }],
  ];
  const images = Object.fromEntries(['polvo', 'agachado', 'shell', 'despiece', 'almeja', 'arbol', 'nieve', 'habitaculo', 'volante', 'calle', 'n4', 'salonen']
    .map((k) => [k, `${k}.jpg`]).concat([['logo', 'logo.png']]));
  const loadImg = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });

  window.ready = (async () => {
    await Promise.all(fonts.map(async ([family, file, desc]) => {
      const f = new FontFace(family, `url(../assets/fonts/${file})`, desc);
      await f.load();
      document.fonts.add(f);
    }));
    const assets = {};
    for (const [k, file] of Object.entries(images)) {
      const im = await loadImg(`../build/img/${file}`);
      if (im) assets[k] = im;
    }
    init(assets);
    const canvas = document.getElementById('c');
    window.seek = (t) => seek(canvas, t);
    window.canvas = canvas;
    seek(canvas, 0);
    if (!location.search.includes('still')) {
      const t0 = performance.now();
      const loop = () => { seek(canvas, ((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    }
    return Object.keys(assets);
  })();
</script>
</body>
</html>
