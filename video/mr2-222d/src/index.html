<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Toyota MR2 222D</title>
<style>
  html, body { margin: 0; background: #0B0C0E; }
  canvas { display: block; width: 100vw; height: auto; max-height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
  import { init, seek } from './scenes.js';
  import { DURATION } from './timeline.js';

  const fonts = [
    ['IBM Plex Sans Condensed', 'IBMPlexSansCondensed-500.ttf', { weight: '500' }],
    ['IBM Plex Sans Condensed', 'IBMPlexSansCondensed-600.ttf', { weight: '600' }],
    ['IBM Plex Sans Condensed', 'IBMPlexSansCondensed-700.ttf', { weight: '700' }],
    ['IBM Plex Sans', 'IBMPlexSans-500.ttf', { weight: '500' }],
    ['IBM Plex Sans', 'IBMPlexSans-600.ttf', { weight: '600' }],
    ['IBM Plex Sans', 'IBMPlexSans-700.ttf', { weight: '700' }],
  ];
  const images = Object.fromEntries(['callesB', 'celica', 'cenital', 'coleccion', 'escondido', 'fia', 'habitaculo', 'lateral', 'mr2', 'museoFrente', 'peugeot', 'plano', 'puerta', 'trasera', 'zaga']
    .map((k) => [k, `${k}.jpg`]).concat([['logo', 'logo.png']]));
  const loadImg = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });

  window.ready = (async () => {
    await Promise.all(fonts.map(async ([family, file, desc]) => {
      const f = new FontFace(family, `url(../assets/fonts/${file})`, desc);
      await f.load();
      document.fonts.add(f);
    }));
    const assets = {};
    for (const [k, file] of Object.entries(images)) {
      const im = await loadImg(`../build/img/${file}`);
      if (im) assets[k] = im;
    }
    // Fotogramas del clip del cliente (sus 9 primeros segundos: el 222D en Goodwood), en orden.
    assets.clip = [];
    for (let i = 1; i <= 270; i++) assets.clip.push(await loadImg(`../build/clip/f${String(i).padStart(3, '0')}.jpg`));
    init(assets);
    const canvas = document.getElementById('c');
    window.seek = (t) => seek(canvas, t);
    window.canvas = canvas;
    seek(canvas, 0);
    if (!location.search.includes('still')) {
      const t0 = performance.now();
      const loop = () => { seek(canvas, ((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    }
    return Object.keys(assets);
  })();
</script>
</body>
</html>
