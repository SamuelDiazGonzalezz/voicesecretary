<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>EvoHeritage promo</title>
<style>
  html, body { margin: 0; background: #0B0C0E; }
  canvas { display: block; width: 100vw; height: auto; max-height: 100vh; width: auto; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
  import { init, seek } from './scenes.js';
  import { DURATION } from './timeline.js';

  const fonts = [
    ['Barlow Condensed', 'BarlowCondensed-SemiBoldItalic.ttf', { weight: '600', style: 'italic' }],
    ['Barlow Condensed', 'BarlowCondensed-ExtraBoldItalic.ttf', { weight: '800', style: 'italic' }],
    ['Barlow Condensed', 'BarlowCondensed-BlackItalic.ttf', { weight: '900', style: 'italic' }],
    ['Barlow', 'Barlow-Medium.ttf', { weight: '500' }],
    ['Barlow', 'Barlow-SemiBold.ttf', { weight: '600' }],
    ['Barlow', 'Barlow-Bold.ttf', { weight: '700' }],
  ];
  const images = Object.fromEntries(['bosque', 'callesB', 'curva', 'lancia037', 'llamas', 'mr2frente', 'mr2trasera', 'polvo', 'quattroCutaway', 'quattroHero', 'quattroS1', 't16arbol', 't16despiece', 't16nieve']
    .map((k) => [k, `${k}.jpg`]).concat([['logo', 'logo.png']]));
  const loadImg = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });

  window.ready = (async () => {
    await Promise.all(fonts.map(async ([family, file, desc]) => {
      const f = new FontFace(family, `url(../assets/fonts/${file})`, desc);
      await f.load();
      document.fonts.add(f);
    }));
    const assets = {};
    for (const [k, file] of Object.entries(images)) {
      const im = await loadImg(`../build/img/${file}`);
      if (im) assets[k] = im;
    }
    // Fotogramas del clip del cliente (Evo VI, segundos 9 a 16 de su vídeo), en orden.
    assets.clip = [];
    for (let i = 1; i <= 210; i++) assets.clip.push(await loadImg(`../build/clip/f${String(i).padStart(3, '0')}.jpg`));
    init(assets);
    const canvas = document.getElementById('c');
    window.seek = (t) => seek(canvas, t);
    window.canvas = canvas;
    seek(canvas, 0);
    if (!location.search.includes('still')) {
      const t0 = performance.now();
      const loop = () => { seek(canvas, ((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    }
    return Object.keys(assets);
  })();
</script>
</body>
</html>
